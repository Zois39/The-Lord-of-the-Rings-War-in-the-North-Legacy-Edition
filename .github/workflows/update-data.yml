name: update-data
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # еженедельно, вики может обновляться
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch wiki content
        run: python tools/fetch_wiki.py
      - name: Parse data
        run: python tools/parse_items.py
      - name: Fetch images
        run: python tools/fetch_images.py
      - name: Commit data
        run: |
          git config user.name "witn-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: sync witn.fandom.com ($(date -u +%Y-%m-%d))"
            git push
          fi
