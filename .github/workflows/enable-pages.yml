name: enable-pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Pages site
        run: |
          curl -sS -X POST             -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"             -H "Accept: application/vnd.github+json"             https://api.github.com/repos/${{ github.repository }}/pages             -d '{"source":{"branch":"main","path":"/"}}'
      - name: Wait for deployment
        run: |
          for i in $(seq 1 30); do
            sleep 10
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index.html)
            echo "check $i: $STATUS"
            if [ "$STATUS" = "200" ]; then echo "PAGES LIVE"; exit 0; fi
          done
          exit 1
