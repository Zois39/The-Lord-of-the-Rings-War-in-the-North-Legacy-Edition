<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WITN: Legacy Edition — Build Builder</title>
<style>
:root{--bg:#10151c;--panel:#1a2330;--panel2:#222d3d;--line:#31415a;--txt:#d7e1ee;
--dim:#8ea0b5;--acc:#c9a227;--acc2:#e8c95a;--good:#6fbf73;--bad:#d06a5e;--magic:#7fb0e0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);
font:14px/1.45 "Segoe UI",system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--panel);
border-bottom:2px solid var(--acc);flex-wrap:wrap}
header h1{font-size:17px;margin:0;color:var(--acc2);letter-spacing:.5px}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tabs button{background:var(--panel2);color:var(--dim);border:1px solid var(--line);
padding:6px 12px;cursor:pointer;border-radius:4px;font-size:13px}
.tabs button.on{background:var(--acc);color:#1a1300;font-weight:600;border-color:var(--acc)}
main{display:grid;grid-template-columns:1fr 320px;gap:12px;padding:12px;max-width:1500px;margin:0 auto}
@media(max-width:1000px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px}
.panel h2{margin:0 0 10px;font-size:14px;color:var(--acc2);text-transform:uppercase;letter-spacing:1px}
/* --- навыки --- */
.tree{border:1px solid var(--line);border-radius:6px;margin-bottom:10px;overflow:hidden}
.tree>header{display:flex;justify-content:space-between;padding:7px 10px;background:var(--panel2)}
.tree>header b{color:var(--acc2)}
.skill{display:flex;gap:10px;padding:9px 10px;border-top:1px solid var(--line);
align-items:center;cursor:pointer;user-select:none}
.skill:hover{background:#22304a}
.skill.sel{background:#3a2f10;border-left:3px solid var(--acc)}
.skill .ic{width:30px;height:30px;flex:0 0 30px;border-radius:4px;display:flex;align-items:center;
justify-content:center;background:#0c1117;border:1px solid var(--line);overflow:hidden}
.skill .ic img{width:28px;height:28px;object-fit:contain}
.skill.act .ic{border-color:var(--acc)}
.skill .nm{font-weight:600}
.skill .meta{color:var(--dim);font-size:12px}
.skill .ds{color:var(--dim);font-size:12.5px;margin-top:2px}
.pips{display:flex;gap:3px;margin-left:auto;flex:0 0 auto}
.pip{width:12px;height:12px;border-radius:50%;border:1px solid var(--dim);display:inline-block}
.pip.f{background:var(--acc);border-color:var(--acc)}
/* --- карточки снаряжения --- */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.filters input[type=text]{flex:1;min-width:140px}
button.chip{background:var(--panel2);border:1px solid var(--line);color:var(--dim);
border-radius:12px;padding:3px 11px;cursor:pointer;font-size:12px}
button.chip.on{border-color:var(--acc);color:var(--acc2);background:#2b2410}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:8px}
.card{border:1px solid var(--line);border-radius:6px;padding:9px;cursor:pointer;background:var(--panel)}
.card:hover{border-color:var(--acc)}
.card.sel{border-color:var(--acc);background:#3a2f10}
.card .top{display:flex;gap:8px;align-items:center;margin-bottom:5px}
.card .ic{width:34px;height:34px;flex:0 0 34px;border-radius:4px;display:flex;align-items:center;
justify-content:center;background:#0c1117;border:1px solid var(--line);overflow:hidden}
.card .ic img{width:32px;height:32px;object-fit:contain}
.card .nm{font-weight:600;font-size:13px;line-height:1.25}
.card .tp{color:var(--dim);font-size:11px}
.card .st{font-size:12px;color:var(--magic)}
.card .ef{font-size:11.5px;color:var(--dim);margin-top:3px;max-height:32px;overflow:hidden}
.card .rq{font-size:11px;color:var(--dim);margin-top:4px}
.badge{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:11px;
color:var(--dim);margin:1px 2px}
.badge.s{color:var(--acc2);border-color:var(--acc)}
.badge.b{color:var(--magic)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.row label{color:var(--dim);font-size:12.5px}
input[type=number],select,input[type=text]{background:#0c1117;color:var(--txt);border:1px solid var(--line);
border-radius:4px;padding:5px 7px;font-size:13px}
.summary li{margin:4px 0}
button.sm{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:4px;
padding:4px 9px;cursor:pointer;font-size:12px}
button.sm:hover{border-color:var(--acc)}
.attr{display:flex;gap:6px;align-items:center;margin:6px 0}
.attr label{width:95px;color:var(--dim)}
.attr b{width:26px;text-align:center}
textarea{width:100%;background:#0c1117;color:var(--txt);border:1px solid var(--line);border-radius:4px;
font:12px/1.4 monospace;padding:6px;min-height:70px}
footer{padding:10px 16px;color:var(--dim);font-size:11.5px;border-top:1px solid var(--line);max-width:1500px;margin:0 auto}
.warn{color:var(--bad)}.ok{color:var(--good)}
.gear-slot{border:1px dashed var(--line);border-radius:5px;padding:6px 9px;margin:5px 0;font-size:12.5px;cursor:pointer}
.gear-slot:hover{border-color:var(--acc)}
.gear-slot b{color:var(--acc2)}
.stats{margin:6px 0}
.st-row{display:flex;justify-content:space-between;padding:3px 0;font-size:13px}
.st-row span{color:var(--dim)}
.st-row.hp b{color:var(--good)}.st-row.pw b{color:var(--magic)}
.st-attrs{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);color:var(--dim);font-size:12px}
.rq.warn{color:var(--bad)}
#loader{position:fixed;inset:0;background:rgba(10,14,20,.94);display:flex;align-items:center;justify-content:center;z-index:99}
.ld-box{width:min(420px,86vw);text-align:center}
.ld-title{color:var(--acc2);font-size:16px;margin-bottom:10px}
.ld-stage{color:var(--dim);font-size:13px;margin-bottom:12px;min-height:18px}
.ld-bar{height:8px;background:#0c1117;border:1px solid var(--line);border-radius:5px;overflow:hidden}
#ldFill{height:100%;width:0;background:var(--acc);transition:width .2s}
.row-sep{text-align:center;color:var(--dim);font-size:11px;padding:4px 0;border-top:1px dashed var(--line);letter-spacing:1px}
.skill.locked{opacity:.62}
.badge.lock{color:var(--bad);border-color:var(--bad)}
.tier-block{border-top:1px solid var(--line)}
.tier-block.locked{opacity:.85}
.tier-head{padding:5px 10px;background:#141c28;color:var(--acc2);font-size:11.5px;letter-spacing:.5px;border-bottom:1px solid var(--line)}
.tier-block.locked .tier-head{color:var(--bad)}
.row-sep{display:none}
</style>
</head>
<body>
<header>
<h1>⚔ War in the North · Legacy Edition — Build Builder</h1>
<div class="tabs" id="tabs">
<button data-t="skills" class="on">Навыки</button>
<button data-t="gear">Снаряжение</button>
<button data-t="squad">Отряд</button>
<button data-t="build">Билд</button>
</div>
</header>
<main>
<section class="panel" id="content"></section>
<aside class="panel" id="side"></aside>
</main>
<div id="loader"><div class="ld-box"><div class="ld-title">Загрузка базы данных…</div><div class="ld-stage" id="ldStage">подключение…</div><div class="ld-bar"><div id="ldFill"></div></div></div></div>
<footer>Некоммерческий фанатский инструмент. Данные: <a href="https://witn.fandom.com" style="color:var(--acc2)">WitN Wiki</a> (CC BY-SA 3.0) · Код: MIT · Поддержка разработки: добровольные донаты (см. LICENSE)</footer>
<script>
/* ================= МОДЕЛЬ ================= */
const DB={heroes:{},items:{sets:[],weapons:[],armor:[],potions:[],ingredients:[],boss_loot:[],elf_stones:[],best_gear:[]}};
const build={hero:"Eradan",level:20,attrs:{str:0,wil:0,dex:0,sta:0},skills:{},gear:{slots:{mainhand:null,offhand:null,ranged:null,head:null,shoulders:null,body:null,gloves:null,legs:null,boots:null,amulet:null,ring1:null,ring2:null}}};
const SLOTORDER=["mainhand","offhand","ranged","head","shoulders","body","gloves","legs","boots","amulet","ring1","ring2"];
const SLOTNAMES={mainhand:"Оружие (правая)",offhand:"Вторая рука / щит",ranged:"Дальний бой",head:"Голова",shoulders:"Плечи",body:"Тело",gloves:"Перчатки",legs:"Поножи",boots:"Сапоги",amulet:"Амулет",ring1:"Кольцо 1",ring2:"Кольцо 2"};
const ARMORFILTERS=[["Все","Все"],["Headpiece","Голова"],["Shoulders","Плечи"],["Body","Тело"],["Gloves","Перчатки"],["Leggings","Поножи"],["Boots","Сапоги"],["Rings","Кольца"],["Amulets","Амулеты"]];
const ARMORSLOTMAP={headpiece:"head",shoulders:"shoulders",body:"body",gloves:"gloves",leggings:"legs",boots:"boots",amulets:"amulet",amulet:"amulet",rings:null,ring:null};
const COEF={hpPerSta:5,powerPerWil:2,melPerStr:2,rngPerDex:2,baseHp:100,basePower:50,baseArrows:20,arrowsPerQuiver:10};
function treePoints(t){return t.skills.reduce((a,x)=>a+((build.skills[x.name]||{}).rank||0),0);}
function tierPoints(t,n){return t.skills.reduce((a,x)=>a+(((x.tier||1)===n)?((build.skills[x.name]||{}).rank||0):0),0);}
function skillGate(sk,t){
 const k=sk.tier||1;
 if(k<=1)return{need:0,has:0,base:null};
 if(k===2)return{need:1,has:tierPoints(t,1),base:"тир 1 вкачан"};
 let sum=0;for(let j=2;j<k;j++)sum+=tierPoints(t,j);
 return{need:3*(k-2),has:sum,base:"тиры 2–"+(k-1)};}
function canInvest(sk,t){const g=skillGate(sk,t);return g.has>=g.need;}
const ATTRKEY={strength:"str",will:"wil",dexterity:"dex",stamina:"sta"};
const ATTRS=["str","wil","dex","sta"];
const ATTRNAMES={str:"Strength",wil:"Will",dex:"Dexterity",sta:"Stamina"};
const SLONAMES={head:"Голова",shoulders:"Плечи",body:"Тело",gloves:"Перчатки",leggings:"Поножи",boots:"Сапоги",ring1:"Кольцо 1",ring2:"Кольцо 2"};
const tab={cur:"skills",eqType:"weapons",q:"",qual:"Все",armorSlot:"Все"};

function setStage(txt,pct){const s=document.getElementById("ldStage"),f=document.getElementById("ldFill");
 if(s)s.textContent=txt;if(f)f.style.width=pct+"%";}
async function load(){
 const steps=[["Навыки героев: Eradan…","skills/eradan"],["Навыки героев: Andriel…","skills/andriel"],["Навыки героев: Farin…","skills/farin"],
  ["Предметы: комплекты брони…","items/sets"],["Предметы: оружие…","items/weapons"],["Предметы: броня…","items/armor"],
  ["Предметы: зелья…","items/potions"],["Предметы: ингредиенты…","items/ingredients"],["Предметы: лут боссов…","items/boss_loot"],
  ["Предметы: камни-эльфы…","items/elf_stones"],["Предметы: лучшее снаряжение…","items/best_gear"]];
 try{
  for(let i=0;i<steps.length;i++){
   setStage(steps[i][0],Math.round(i/steps.length*100));
   const url="data/raw/"+steps[i][1]+".json";
   if(steps[i][1].startsWith("skills/"))DB.heroes[steps[i][1].split("/")[1][0].toUpperCase()+steps[i][1].split("/")[1].slice(1)]=await(await fetch(url)).json();
   else{const key=steps[i][1].split("/")[1];try{DB.items[key]=await(await(fetch(url))).json()}catch(e){DB.items[key]=[]}}
  }
  setStage("Готово",100);
  render();
  setTimeout(()=>{const l=document.getElementById("loader");if(l)l.style.display="none";},300);
 }catch(e){setStage("Ошибка загрузки: "+e.message+" — обновите страницу",0);}
}
function save(){localStorage.setItem("witn-build",JSON.stringify(build))}
function restore(){try{const s=localStorage.getItem("witn-build");if(!s)return;const d=JSON.parse(s);
 if(d.gear&&d.gear.armor){ // миграция v1 -> v2
  d.gear.slots={mainhand:d.gear.weapon||null,offhand:null,ranged:d.gear.ranged||null,head:null,shoulders:d.gear.armor.shoulders||null,body:d.gear.armor.body||null,gloves:d.gear.armor.gloves||null,legs:d.gear.armor.leggings||null,boots:d.gear.armor.boots||null,amulet:null,ring1:d.gear.armor.ring1||null,ring2:d.gear.armor.ring2||null};
  delete d.gear.armor;delete d.gear.weapon;delete d.gear.ranged;}
 Object.assign(build,d);}catch(e){}}
function esc(s){return (s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const el=id=>document.getElementById(id);
function icon(rec,glyph){
 if(rec&&rec.local_image)return `<div class="ic"><img src="${esc(rec.local_image)}" alt="" onerror="this.parentNode.textContent='${glyph}'"></div>`;
 return `<div class="ic">${glyph}</div>`;
}
function skillPoints(){return Object.values(build.skills).reduce((a,s)=>a+(s.rank||0),0)}
function attrPoints(){return ATTRS.reduce((a,k)=>a+build.attrs[k],0)}


/* ================= ХАРАКТЕРИСТИКИ ================= */
function findItem(name){
 if(!name)return null;
 for(const f of["weapons","armor","best_gear","boss_loot"])
  {const r=(DB.items[f]||[]).find(x=>x.name===name);if(r)return r;}
 return null;}
function parseEffects(rec){
 const out={str:0,wil:0,dex:0,sta:0,melee:0,ranged:0,armor:0,power:0,arrows:0,elem:{},other:[]};
 const texts=[];
 if(rec){if(rec.effect&&rec.effect!=="-")texts.push(rec.effect);
  if(rec.bonuses){if(Array.isArray(rec.bonuses))texts.push(...rec.bonuses);else texts.push(...Object.values(rec.bonuses));}}
 for(const t of texts){
  for(const m of t.matchAll(/\+(\d+)\s*(Strength|Will|Dexterity|Stamina|Willpower)/gi))
   out[ATTRKEY[m[2].toLowerCase().replace("power","")==="wil"?"will":m[2].toLowerCase()]||ATTRKEY[m[2].toLowerCase()]]=(out[ATTRKEY[m[2].toLowerCase()]]||0)+ +m[1];
  for(const m of t.matchAll(/\+(\d+)\s*(Fire|Ice|Shock|Poison|Light|Shadow)?\s*Damage/gi)){
   if(m[2])out.elem[m[2].toLowerCase()]=(out.elem[m[2].toLowerCase()]||0)+ +m[1];
   else out.melee+=+m[1];}
  for(const m of t.matchAll(/\+(\d+)\s*Armor/gi))out.armor+=+m[1];
  for(const m of t.matchAll(/\+(\d+)\s*Power/gi))out.power+=+m[1];
  for(const m of t.matchAll(/\+(\d+)\s*(Health|HP)\b/gi))out.hp=(out.hp||0)+ +m[1];
 }
 return out;}
function dmgRange(s){if(!s)return null;const m=String(s).match(/(\d+)\s*-\s*(\d+)/);
 if(!m)return null;return[ +m[1],+m[2] ];}
function computeStats(){
 const g=build.gear.slots;
 const eff={str:10+build.attrs.str,wil:10+build.attrs.wil,dex:10+build.attrs.dex,sta:10+build.attrs.sta};
 const acc={melee:0,ranged:0,armor:0,power:0,arrows:0,hp:0,elem:{}};
 for(const k of SLOTORDER){const it=findItem(g[k]);if(!it)continue;
  const e=parseEffects(it);
  for(const a of["str","wil","dex","sta"])eff[a]+=e[a];
  acc.melee+=e.melee;acc.ranged+=e.ranged;acc.armor+=e.armor;acc.power+=e.power;acc.arrows+=e.arrows;acc.hp+=e.hp||0;
  for(const el in e.elem)acc.elem[el]=(acc.elem[el]||0)+e.elem[el];
  if(typeof it.armor==="number")acc.armor+=it.armor;}
 const q=(build.skills["Broad Quiver"]||{}).rank||0;
 acc.arrows+=q*COEF.arrowsPerQuiver;
 const mw=findItem(g.mainhand),rw=findItem(g.ranged),ow=findItem(g.offhand);
 const md=mw?dmgRange(mw.damage):null,rd=rw?dmgRange(rw.damage):null;
 const od=(ow&&(ow.type||"").match(/1-handed/i))?dmgRange(ow.damage):null;
 const melBonus=eff.str*COEF.melPerStr+acc.melee;
 let melee=md?Math.round(md[0]+melBonus)+" – "+Math.round(md[1]+melBonus):"—";
 if(md&&od)melee+=" + "+Math.round(od[0]+melBonus)+" – "+Math.round(od[1]+melBonus);
 return{
  attrs:eff,
  hp:COEF.baseHp+eff.sta*COEF.hpPerSta+acc.hp,
  power:COEF.basePower+eff.wil*COEF.powerPerWil+acc.power,
  melee,
  ranged:rd?Math.round(rd[0]+eff.dex*COEF.rngPerDex+acc.ranged)+" – "+Math.round(rd[1]+eff.dex*COEF.rngPerDex+acc.ranged):"—",
  armor:acc.armor,
  arrows:COEF.baseArrows+acc.arrows,
  elem:acc.elem,
  weapon:mw?mw.name:null,rweapon:rw?rw.name:null};
}
function reqsOk(rec){
 if(!rec)return true;const st=computeStats();let ok=true,msg=[];
 if(rec.level_req&&st.attrs&&(build.level<+rec.level_req)){ok=false;msg.push("ур."+rec.level_req);}
 const R={str_req:"str",wil_req:"wil",dex_req:"dex",sta_req:"sta"};
 for(const k in R){if(rec[k]&&st.attrs[R[k]]<+rec[k]){ok=false;msg.push(R[k].toUpperCase()+" "+rec[k]);}}
 return{ok,msg:msg.join(" ")};}

/* ================= РЕНДЕР ================= */
function render(){renderSide();const c=el("content");
 if(tab.cur==="skills")c.innerHTML=viewSkills();
 else if(tab.cur==="gear")c.innerHTML=viewGear();
 else if(tab.cur==="squad")c.innerHTML=viewSquad();
 else c.innerHTML=viewBuild();
 bind();}
function renderSide(){
 const st=computeStats();
 const himg=DB.heroes[build.hero]&&DB.heroes[build.hero].local_image;
 const elemLine=Object.keys(st.elem).length?`<div class="st-row"><span>Стихии</span><b>${Object.entries(st.elem).map(([k,v])=>v+" "+k).join(", ")}</b></div>`:"";
 let h=(himg?`<img src="${esc(himg)}" style="width:54px;height:54px;object-fit:cover;border-radius:6px;border:1px solid var(--acc);display:block;margin-bottom:8px" alt="">`:"")+
 `<h2>${build.hero} · ${DB.heroes[build.hero]?DB.heroes[build.hero].archetype:""}</h2>
 <div class="stats">
  <div class="st-row hp"><span>❤ Здоровье</span><b>${st.hp}</b></div>
  <div class="st-row pw"><span>⚡ Мощь</span><b>${st.power}</b></div>
  <div class="st-row"><span>🛡 Броня</span><b>${st.armor}</b></div>
  <div class="st-row"><span>⚔ Урон ближний</span><b title="оружие + бонус силы">${st.melee}</b></div>
  <div class="st-row"><span>🏹 Урон дальний</span><b title="оружие + бонус ловкости">${st.ranged}</b></div>
  <div class="st-row"><span>➶ Стрелы</span><b>${st.arrows}</b></div>
  ${elemLine}
  <div class="st-attrs">СИЛ ${st.attrs.str} · ВОЛ ${st.attrs.wil} · ЛОВ ${st.attrs.dex} · ВЫН ${st.attrs.sta}</div>
 </div><hr style="border-color:var(--line)">`;
 if(tab.cur==="skills"){
  const hero=DB.heroes[build.hero];const spent=skillPoints();
  h+=`<div class="row"><label>Очки навыков: <b class="${spent>build.level?"warn":"ok"}">${spent}</b> / ${build.level}</label></div><hr style="border-color:var(--line)">`;
  hero.trees.forEach(t=>{const s=treePoints(t);
   const maxTier=Math.max(...t.skills.map(x=>x.tier||1));
   const opened=[...Array(maxTier)].filter((_,idx)=>skillGate({tier:idx+1},t).has>=skillGate({tier:idx+1},t).need).length;
   h+=`<div class="row"><label style="width:130px">${esc(t.name)}</label><b>${s}</b>
    <span class="badge" title="тир 2: 1 очко в тире 1; тир 3: 3 очка в тире 2; тир 4: 6 очков в тирах 2–3">тиров: ${opened}/${maxTier}</span></div>`;});
  const chosen=[];hero.trees.forEach(t=>t.skills.forEach(s=>{const r=(build.skills[s.name]||{}).rank||0;if(r)chosen.push({t:t.name,...s,rank:r})}));
  if(chosen.length){h+=`<hr style="border-color:var(--line)">`+chosen.map(c=>
   `<div class="row" style="margin:3px 0"><span style="flex:1">${esc(c.name)}</span><span class="badge s">${c.rank}${c.max_rank?"/"+c.max_rank:""}</span></div>`).join("");}

 }else if(tab.cur!=="build"){
  h+=`<h2>Слоты</h2>`+SLOTORDER.map(sl=>{
   if(build.gear.slots[sl]==="2H")return `<div class="gear-slot" style="opacity:.55"><b>${SLOTNAMES[sl]}:</b> <span style='color:var(--dim)'>занято двуручным оружием</span></div>`;
   const it=findItem(build.gear.slots[sl]);
   return `<div class="gear-slot" data-un="${sl}"><b>${SLOTNAMES[sl]}:</b> ${it?esc(it.name):"<span style='color:var(--dim)'>—</span>"} ${it?'<span style="float:right">×</span>':""}</div>`;}).join("");
 }
 el("side").innerHTML=h;
 if(tab.cur==="build"){const e=el("expBtn");if(e)e.onclick=()=>{el("ioBox").value=JSON.stringify(build);el("ioBox").select();document.execCommand("copy")};}

 document.querySelectorAll("[data-un]").forEach(x=>x.onclick=()=>{
  build.gear.slots[x.dataset.un]=null;save();render();});
}
function viewSkills(){
 const hero=DB.heroes[build.hero];
 const portrait=hero.local_image?`<img src="${esc(hero.local_image)}" style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--acc);float:right;margin-left:10px" alt="">`:"";
 return `<h2>${build.hero} — ${hero.archetype}</h2>${portrait}<p style="color:var(--dim)">${esc(hero.description)}</p>`+
 hero.trees.map(t=>`<div class="tree">
  <header><b>${esc(t.name)}</b><span class="badge">${t.skills.filter(s=>((build.skills[s.name]||{}).rank||0)>0).length}/${t.skills.length} · ${treePoints(t)} очк.</span></header>
  ${(()=>{
   const byTier={};
   t.skills.forEach(s=>{const tr=s.tier||1;(byTier[tr]=byTier[tr]||[]).push(s);});
   return Object.keys(byTier).sort((a,b)=>a-b).map(tn=>{
    const tier=+tn,skills=byTier[tn];
    const g=skillGate(skills[0],t);
    const lockedTier=tier>1&&g.has<g.need;
    const head=tier===1?`Тир 1 · открывает ветку`
     :(lockedTier?`Тир ${tier} · 🔒 нужно ${g.need} очк. (${g.has}/${g.need} в ${g.base})`:`Тир ${tier} · ✓ открыт`);
    return `<div class="tier-block ${lockedTier?"locked":""}">
     <div class="tier-head">${head}</div>
     ${skills.map(s=>{
      const cur=(build.skills[s.name]||{}).rank||0;const maxR=s.max_rank||1;
      const sg=skillGate(s,t);const locked=cur===0&&sg.has<sg.need;
      const pips=Array.from({length:maxR},(_,i)=>`<span class="pip ${i<cur?"f":""}"></span>`).join("");
      const tech=`${s.type==="active"?"⚡ активный":"◈ пассивный"}${s.max_rank?" · до "+s.max_rank+" ранг.":""}${s.cost?" · "+esc(s.cost):""}`;
      return `<div class="skill ${s.type==="active"?"act":""} ${cur?"sel":""} ${locked?"locked":""}" data-sk="${esc(s.name)}" data-max="${maxR}" data-tier="${tier}" title="${locked?("Требуется: "+head):""}">
       ${icon(s,s.type==="active"?"⚡":"◈")}
       <div style="flex:1"><div class="nm">${esc(s.name)}</div>
       <div class="meta">${tech}</div>
       <div class="ds">${esc(s.description)}</div></div>
       <div class="pips">${pips}</div></div>`;}).join("")}
    </div>`;}).join("");})()}
 </div>`).join("");
}

function viewGear(){
 const types=[["weapons","Оружие"],["armor","Броня"],["sets","Сеты"],["potions","Зелья"],["ingredients","Ингредиенты"],["boss_loot","Лут боссов"],["elf_stones","Камни"],["best_gear","Лучшее"]];
 let h=`<h2>Снаряжение</h2><div class="filters">`+
  types.map(([k,n])=>`<button class="chip ${tab.eqType===k?"on":""}" data-tp="${k}">${n}</button>`).join("")+
  `<input type="text" id="search" placeholder="Поиск…" value="${esc(tab.q)}"></div>`;
 const q=tab.q.toLowerCase();
 let rows=DB.items[tab.eqType]||[];
 if(q)rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));
 if(!rows.length)return h+"<p style='color:var(--dim)'>Нет данных.</p>";
 if(tab.eqType==="armor"&&tab.qual!=="Все")rows=rows.filter(r=>r.quality===tab.qual);
 if(tab.eqType==="armor"&&tab.armorSlot!=="Все")rows=rows.filter(r=>r.slot===tab.armorSlot);
 if(tab.eqType==="armor"){
  h=`<h2>Снаряжение</h2><div class="filters">`+types.map(([k,n])=>`<button class="chip ${tab.eqType===k?"on":""}" data-tp="${k}">${n}</button>`).join("")+
   `<input type="text" id="search" placeholder="Поиск…" value="${esc(tab.q)}"></div>`+
   `<div class="filters">`+ARMORFILTERS.map(([k,n])=>`<button class="chip ${tab.armorSlot===k?"on":""}" data-as="${k}">${n}</button>`).join("")+
   `<span style="width:8px"></span>`+["Все","Standard","High","Masterwork"].map(x=>`<button class="chip ${tab.qual===x?"on":""}" data-ql="${x}">${x==="Все"?"Любое кач.":x}</button>`).join("")+`</div>`;
 }
 h+=`<div class="grid">`+rows.map(r=>{
  const nm=r.set||r.name;
  const isSel=SLOTORDER.some(s=>build.gear.slots[s]===nm);
  let main="",eff="",req="";
  if(r.damage)main=`Урон ${esc(r.damage)}`;
  else if(r.armor)main=`Броня ${esc(r.armor)}`;
  else if(r.values)main=`Норм ${esc(r.values.normal??"-")} · Сияющ ${esc(r.values.glowing??"-")} · Легенд ${esc(r.values.legendary??"-")}`;
  else if(r.bonuses)main=Array.isArray(r.bonuses)?`${r.bonuses.length} бонусов`:`${Object.keys(r.bonuses).join("/")} предметов`;
  else if(r.value!==undefined&&r.value!=="")main=`Цена ${esc(r.value)}`;
  eff=(r.effect&&r.name!==r.effect?esc(r.effect):"")||r.description||(Array.isArray(r.bonuses)?r.bonuses.map(esc).join(" · "):"")||(r.bonuses?Object.entries(r.bonuses).map(([n,b])=>n+" предм.: "+b).join(" · "):"")||"";
  if(r.level_req||r.str_req||r.dex_req||r.wil_req||r.sta_req||r.reqs){
   const rs=[];if(r.level_req)rs.push("ур."+r.level_req);
   if(r.str_req)rs.push("СИЛ "+r.str_req);if(r.wil_req)rs.push("ВОЛ "+r.wil_req);
   if(r.dex_req)rs.push("ЛОВ "+r.dex_req);if(r.sta_req)rs.push("ВЫН "+r.sta_req);
   req=rs.join(" · ");
  }
  return `<div class="card ${isSel?"sel":""}" data-nm="${esc(nm)}">
   <div class="top">${icon(r,"🛡")}<div><div class="nm">${esc(nm)}</div>
   <div class="tp">${esc(r.type||r.slot||r.quality||r.group||(r.boss?("Лут: "+r.boss):""))}</div></div></div>
   ${r.source?`<div class="rq" title="${esc(r.source)}">${esc(r.source.slice(0,60))}${r.source.length>60?"…":""}</div>`:""}
   <div class="st">${main}</div>
   ${eff?`<div class="ef">${esc(eff)}</div>`:""}
   ${(()=>{const r0=reqsOk(r);return req?`<div class="rq ${r0.ok?"":"warn"}">${req}${r0.ok?"":" ⚠ "+r0.msg}</div>`:"";})()}
  </div>`}).join("")+`</div>`;
 return h;
}
function viewSquad(){
 return `<h2>Отряд</h2>
 <div class="row"><label>Герой</label><select id="heroSel">${Object.keys(DB.heroes).map(h=>`<option ${h===build.hero?"selected":""}>${h}</option>`).join("")}</select></div>
 <div class="row"><label>Уровень</label><input type="number" id="lvl" min="1" max="40" value="${build.level}"></div>
 <div class="row"><label>Очки навыков: <b class="${skillPoints()>build.level?"warn":"ok"}">${skillPoints()} / ${build.level}</b></label></div>
 <h2>Атрибуты</h2>
 ${ATTRS.map(k=>`<div class="attr"><label>${ATTRNAMES[k]}</label><button class="sm" data-at="${k}" data-d="-1">−</button><b>${build.attrs[k]}</b><button class="sm" data-at="${k}" data-d="1">+</button></div>`).join("")}
 <div class="row"><label>Очки атрибутов: <b class="${attrPoints()>build.level*3?"warn":"ok"}">${attrPoints()} / ${build.level*3}</b></label></div>
 <hr style="border-color:var(--line)">
 <button class="sm" id="expBtn2">Экспорт билда</button>
 <button class="sm" id="impBtn2">Импорт</button>
 <button class="sm" id="rstBtn2">Сброс</button>
 <textarea id="ioBox2" placeholder="JSON билда…"></textarea>`;
}
function viewBuild(){
 const hero=DB.heroes[build.hero];const chosen=[];
 hero.trees.forEach(t=>t.skills.forEach(s=>{const r=(build.skills[s.name]||{}).rank||0;if(r)chosen.push({t:t.name,...s,rank:r})}));
 const st=computeStats();
 return `<h2>Билд: ${build.hero}, уровень ${build.level}</h2>
 <p style="color:var(--dim)">Навыки: ${skillPoints()}/${build.level} · Атрибуты: ${ATTRS.map(k=>ATTRNAMES[k]+" "+build.attrs[k]).join(", ")}</p>
 <h2>Характеристики</h2>
 <div class="stats">
  <div class="st-row hp"><span>❤ Здоровье</span><b>${st.hp}</b></div>
  <div class="st-row pw"><span>⚡ Мощь</span><b>${st.power}</b></div>
  <div class="st-row"><span>🛡 Броня</span><b>${st.armor}</b></div>
  <div class="st-row"><span>⚔ Ближний бой</span><b>${st.melee}</b></div>
  <div class="st-row"><span>🏹 Дальний бой</span><b>${st.ranged}</b></div>
  <div class="st-row"><span>➶ Стрелы</span><b>${st.arrows}</b></div>
  <div class="st-attrs">СИЛ ${st.attrs.str} · ВОЛ ${st.attrs.wil} · ЛОВ ${st.attrs.dex} · ВЫН ${st.attrs.sta}</div>
 </div>
 <h2>Навыки (${chosen.length})</h2>
 ${chosen.map(c=>`<div class="skill"><div class="ic">${c.type==="active"?"⚡":"◈"}</div>
  <div style="flex:1"><div class="nm">${esc(c.name)} <span class="badge">${esc(c.t)}</span>
  ${c.max_rank?`<span class="badge s">ранг ${c.rank}/${c.max_rank}</span>`:""}</div>
  <div class="ds">${esc(c.description)}</div></div></div>`).join("")||"<p style='color:var(--dim)'>Навыки не выбраны.</p>"}
 <h2>Экипировка</h2>
 ${SLOTORDER.map(k=>build.gear.slots[k]&&`<span class="badge b">${SLOTNAMES[k]}: ${esc(build.gear.slots[k])}</span>`).filter(Boolean).join(" ")||"<span style='color:var(--dim)'>пусто</span>"}`;
}
/* ================= ЭКИПИРОВКА ОРУЖИЯ ================= */
function equipWeapon(rec){
 const nm=rec.name, ty=rec.type||"", g=build.gear.slots;
 if(ty.match(/bow|crossbow/i))g.ranged=g.ranged===nm?null:nm;
 else if(ty.match(/2-handed|staff/i)){
  if(g.mainhand===nm&&g.offhand==="2H"){g.mainhand=null;g.offhand=null;}
  else{g.mainhand=nm;g.offhand="2H";}
 }else if(ty.match(/shield/i)){
  const mh=findItem(g.mainhand);
  if(mh&&(mh.type||"").match(/2-handed|staff/i))g.mainhand=null;
  g.offhand=g.offhand===nm?null:nm;
 }else{
  const mh=findItem(g.mainhand);
  const dw=((build.skills["Dual Wield"]||{}).rank||0)>0;
  if(mh&&!(mh.type||"").match(/2-handed|staff/i)&&g.mainhand!==nm&&dw)g.offhand=g.offhand===nm?null:nm;
  else g.mainhand=g.mainhand===nm?null:nm;
 }
 save();render();
}
/* ================= СОБЫТИЯ ================= */
function bind(){
 document.querySelectorAll("#tabs button").forEach(x=>x.onclick=()=>{tab.cur=x.dataset.t;
  document.querySelectorAll("#tabs button").forEach(y=>y.classList.toggle("on",y===x));render()});
 // навыки: клик по карточке +1, ПКМ −1
 document.querySelectorAll(".skill[data-sk]").forEach(card=>{
  card.onclick=()=>{const name=card.dataset.sk,max=+card.dataset.max;
   const cur=(build.skills[name]||{}).rank||0;
   if(cur<max){
    const hero=DB.heroes[build.hero];
    for(const t of hero.trees){const sk=t.skills.find(x=>x.name===name);
     if(sk){if(!canInvest(sk,t)){card.style.borderLeft="3px solid var(--bad)";
      setTimeout(()=>card.style.borderLeft="",400);return;}break;}}
   }
   build.skills[name]={rank:cur>=max?0:cur+1};save();render();};
  card.oncontextmenu=e=>{e.preventDefault();const name=card.dataset.sk;
   const cur=(build.skills[name]||{}).rank||0;
   build.skills[name]={rank:Math.max(0,cur-1)};save();render();};});
 // снаряжение
 document.querySelectorAll("[data-tp]").forEach(x=>x.onclick=()=>{tab.eqType=x.dataset.tp;tab.qual="Все";render()});
 document.querySelectorAll("[data-ql]").forEach(x=>x.onclick=()=>{tab.qual=x.dataset.ql==="Все"?"Все":x.dataset.ql+" Quality";render()});
 document.querySelectorAll("[data-as]").forEach(x=>x.onclick=()=>{tab.armorSlot=x.dataset.as;render()});
 const sq=el("search");if(sq){sq.oninput=()=>{tab.q=sq.value;render();const s2=el("search");
  s2.focus();s2.setSelectionRange(s2.value.length,s2.value.length)}}
 document.querySelectorAll(".card[data-nm]").forEach(cd=>cd.onclick=()=>{
  const nm=cd.dataset.nm;
  const rec=findItem(nm);let slot=null;
  if(tab.eqType==="weapons"||tab.eqType==="boss_loot"){equipWeapon(rec||{name:nm});return;}
  else if(tab.eqType==="armor"){
   const s=(rec&&rec.slot||"").toLowerCase();
   if(s==="rings"||s==="ring")slot=build.gear.slots.ring1?(build.gear.slots.ring1===nm?"ring1":"ring2"):"ring1";
   else if(s in ARMORSLOTMAP)slot=ARMORSLOTMAP[s];}
  else if(tab.eqType==="best_gear"){
   const s=(rec&&rec.slot||"").toLowerCase();
   if(/bow|crossbow/.test(s))slot="ranged";
   else if(/one handed|sword|axe|hammer|mace|dagger/.test(s)&&!/two/.test(s))slot="mainhand";
   else if(s in ARMORSLOTMAP)slot=ARMORSLOTMAP[s];
   else if(s==="rings"||s==="ring")slot=build.gear.slots.ring1?(build.gear.slots.ring1===nm?"ring1":"ring2"):"ring1";}
  if(!slot){save();render();return;}
  build.gear.slots[slot]=build.gear.slots[slot]===nm?null:nm;
  save();render();});
 // отряд
 const hs=el("heroSel");if(hs)hs.onchange=()=>{build.hero=hs.value;save();render()};
 const lv=el("lvl");if(lv)lv.onchange=()=>{build.level=Math.max(1,Math.min(40,+lv.value||1));save();render()};
 document.querySelectorAll("[data-at]").forEach(x=>x.onclick=()=>{const k=x.dataset.at,d=+x.dataset.d;
  build.attrs[k]=Math.max(0,build.attrs[k]+d);save();render()});
 const e2=el("expBtn2");if(e2)e2.onclick=()=>{el("ioBox2").value=JSON.stringify(build);el("ioBox2").select();document.execCommand("copy")};
 const i2=el("impBtn2");if(i2)i2.onclick=()=>{try{Object.assign(build,JSON.parse(el("ioBox2").value));save();render()}catch(x){alert("Неверный JSON")}};
 const rst2=el("rstBtn2");if(rst2)rst2.onclick=()=>{if(confirm("Сбросить билд?")){localStorage.removeItem("witn-build");location.reload()}};
}
restore();load();
</script>
