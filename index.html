<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WITN: Legacy Edition — Build Builder</title>
<style>
:root{--bg:#12161d;--bg2:#161c26;--panel:#1b2330;--panel2:#222c3c;--panel3:#2a3648;--gold:#d4af37;--gold2:#e8c95a;--brown:#3a4a61;--text:#dde3ec;--dim:#93a1b5;--dim2:#6b7a8f;--red:#c0392b;--green:#27ae60;--blue:#2980b9;--purple:#9b59b6;--orange:#e67e22;--magic:#7fb0e0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
a{color:var(--gold2)}
header{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:2px solid var(--gold);flex-wrap:wrap}
header h1{font-size:16px;margin:0;color:var(--gold2);letter-spacing:.5px}
.lang-sw{display:flex;gap:2px;margin-left:auto}
.lang-sw button{background:var(--panel2);border:1px solid var(--brown);color:var(--dim);padding:4px 10px;cursor:pointer;font-size:12px;border-radius:4px}
.lang-sw button.on{background:var(--gold);color:#1a1300;font-weight:700;border-color:var(--gold)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:var(--panel2);color:var(--dim);border:1px solid var(--brown);padding:6px 12px;cursor:pointer;border-radius:4px;font-size:13px}
.tabs button.on{background:var(--gold);color:#1a1300;font-weight:600;border-color:var(--gold)}
main{display:grid;grid-template-columns:1fr 320px;gap:12px;padding:12px;max-width:1500px;margin:0 auto}
@media(max-width:1000px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--brown);border-radius:8px;padding:12px}
.panel h2{margin:0 0 10px;font-size:14px;color:var(--gold2);text-transform:uppercase;letter-spacing:1px}
/* === карточка предмета (эталон Outward) === */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.item-card{background:var(--panel2);border:1px solid var(--brown);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.item-card.selected{border-color:var(--gold);background:var(--panel3)}
.item-head{display:flex;gap:10px;align-items:flex-start}
.item-icon{width:48px;height:48px;object-fit:contain;border-radius:6px;flex-shrink:0;background:var(--bg);border:1px solid var(--brown);display:flex;align-items:center;justify-content:center;font-size:20px}
.item-icon img{width:44px;height:44px;object-fit:contain}
.item-title{flex:1;min-width:0}
.item-name{font-size:14px;font-weight:600;line-height:1.25}
.item-type{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.4;word-break:break-word}
.item-stats{display:flex;flex-direction:column;font-size:12px}
.stat-line{display:flex;justify-content:space-between;padding:1.5px 0}
.stat-label{color:var(--dim)}
.stat-value{color:var(--gold2);font-weight:600}
.effects-box{margin-top:2px;padding:7px 9px;background:rgba(39,174,96,.16);border:1px solid rgba(39,174,96,.4);border-radius:6px;font-size:11.5px}
.effects-box .fx-t{font-size:10px;color:#fff;letter-spacing:1px;margin-bottom:3px}
.fx-line{padding:1px 0}
.source-box{margin-top:2px;padding:6px 9px;background:rgba(169,152,120,.08);border-radius:6px;font-size:11.5px;color:var(--dim)}
.item-set{font-size:10.5px;color:var(--gold);margin-top:2px}
.btn{width:100%;padding:10px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;border:1px solid var(--gold);background:var(--brown);color:var(--text)}
.btn:hover{filter:brightness(1.15)}
.btn.alt{background:rgba(142,68,173,.18);border-color:var(--purple);color:#d8bfe8}
.btn.sm{padding:4px 9px;width:auto;font-size:12px;background:var(--panel2);border:1px solid var(--brown);color:var(--text)}
.btn.sm:hover{border-color:var(--gold)}
/* ячейки камней */
.stone-row{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--dim)}
.stone-cell{width:36px;height:36px;border:2px dashed var(--purple);border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;background:rgba(155,89,182,.10);color:var(--purple)}
.stone-cell.full{border-style:solid;border-color:var(--purple);color:#d8aef0;background:rgba(155,89,182,.28);box-shadow:0 0 6px rgba(155,89,182,.5)}
.stone-cell:hover{border-color:#d8aef0;background:rgba(155,89,182,.22)}
/* === карточка навыка === */
.tree{border:1px solid var(--brown);border-radius:8px;margin-bottom:10px;overflow:hidden}
.tree>header{display:flex;justify-content:space-between;padding:7px 10px;background:var(--panel2)}
.tree>header b{color:var(--gold2)}
.tier-block{border-top:1px solid var(--brown)}
.tier-block.locked{opacity:.9}
.tier-head{padding:5px 10px;background:var(--bg2);color:var(--gold2);font-size:11.5px;letter-spacing:.5px;border-bottom:1px solid var(--brown)}
.tier-block.locked .tier-head{color:var(--red)}
.skill{display:flex;gap:10px;padding:9px 10px;border-top:1px solid var(--brown);align-items:flex-start;cursor:pointer;user-select:none}
.skill:first-child{border-top:0}
.skill:hover{background:#3a2c1a}
.skill.sel{background:#3a2f10;border-left:3px solid var(--gold)}
.skill.locked{opacity:.6}
.skill .ic{width:34px;height:34px;flex:0 0 34px;border-radius:5px;display:flex;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--brown);overflow:hidden;font-size:15px}
.skill .ic img{width:32px;height:32px;object-fit:contain}
.skill.act .ic{border-color:var(--gold)}
.skill .nm{font-weight:600}
.skill .meta{color:var(--dim);font-size:11.5px;margin-top:1px}
.skill .ds{color:var(--dim);font-size:12.5px;margin-top:3px;line-height:1.5}
.skill .mech{color:var(--gold2);font-size:12px;margin-top:4px;line-height:1.45}
.pips{display:flex;gap:3px;margin-left:auto;flex:0 0 auto;align-items:center}
.pip{width:12px;height:12px;border-radius:50%;border:1px solid var(--dim);display:inline-block}
.pip.f{background:var(--gold);border-color:var(--gold)}
.t-badge{margin-left:auto;background:var(--brown);color:var(--gold2);border-radius:4px;font-size:10.5px;padding:2px 7px;flex:0 0 auto}
/* фильтры */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.filters input[type=text]{flex:1;min-width:140px;background:var(--bg);color:var(--text);border:1px solid var(--brown);border-radius:4px;padding:5px 7px;font-size:13px}
button.chip{background:var(--panel2);border:1px solid var(--brown);color:var(--dim);border-radius:12px;padding:3px 11px;cursor:pointer;font-size:12px}
button.chip.on{border-color:var(--gold);color:var(--gold2);background:#2b2410}
.badge{display:inline-block;border:1px solid var(--brown);border-radius:10px;padding:0 8px;font-size:11px;color:var(--dim);margin:1px 2px}
.badge.s{color:var(--gold2);border-color:var(--gold)}
.badge.b{color:var(--magic)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.row label{color:var(--dim);font-size:12.5px}
input[type=number],select{background:var(--bg);color:var(--text);border:1px solid var(--brown);border-radius:4px;padding:5px 7px;font-size:13px}
.stats{margin:6px 0}
.st-row{display:flex;justify-content:space-between;padding:3px 0;font-size:13px}
.st-row span{color:var(--dim)}
.st-row.hp b{color:var(--green)}.st-row.pw b{color:var(--magic)}
.st-attrs{margin-top:6px;padding-top:6px;border-top:1px dashed var(--brown);color:var(--dim);font-size:12px}
.gear-slot{border:1px dashed var(--brown);border-radius:5px;padding:6px 9px;margin:5px 0;font-size:12.5px;cursor:pointer}
.gear-slot:hover{border-color:var(--gold)}
.gear-slot b{color:var(--gold2)}
.gear-slot .mini-stones{font-size:10.5px;color:var(--dim)}
.attr{display:flex;gap:6px;align-items:center;margin:6px 0}
.attr label{width:95px;color:var(--dim)}
.attr b{width:26px;text-align:center}
textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--brown);border-radius:4px;font:12px/1.4 monospace;padding:6px;min-height:70px}
footer{padding:10px 16px;color:var(--dim);font-size:11.5px;border-top:1px solid var(--brown);max-width:1500px;margin:0 auto}
.warn{color:var(--red)}.ok{color:var(--green)}
.rq.warn{color:var(--red)}
/* загрузчик */
#loader{position:fixed;inset:0;background:rgba(16,12,8,.95);display:flex;align-items:center;justify-content:center;z-index:99}
.ld-box{width:min(420px,86vw);text-align:center}
.ld-title{color:var(--gold2);font-size:16px;margin-bottom:10px}
.ld-stage{color:var(--dim);font-size:13px;margin-bottom:12px;min-height:18px}
.ld-bar{height:8px;background:var(--bg);border:1px solid var(--brown);border-radius:5px;overflow:hidden}
#ldFill{height:100%;width:0;background:var(--gold);transition:width .2s}
/* модалка выбора камня */
.modal{position:fixed;inset:0;background:rgba(10,8,5,.8);display:flex;align-items:center;justify-content:center;z-index:90}
.modal-box{width:min(560px,92vw);max-height:76vh;overflow:auto;background:var(--panel);border:1px solid var(--gold);border-radius:10px;padding:12px}
.modal-box h3{margin:0 0 10px;font-size:14px;color:var(--gold2)}
.stone-pick{display:flex;justify-content:space-between;gap:8px;padding:7px 9px;border:1px solid var(--brown);border-radius:6px;margin-bottom:6px;cursor:pointer;font-size:12.5px}
.stone-pick:hover{border-color:var(--gold);background:var(--panel2)}
.stone-pick .gr{color:var(--dim);font-size:11px}
.set-box{margin-top:2px;padding:7px 9px;background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.35);border-radius:6px;font-size:11.5px}
.set-tier{display:flex;gap:8px;padding:2px 0;align-items:baseline}
.set-tier .st-n{flex:0 0 62px;color:var(--gold2);font-weight:600;font-size:10.5px}
.set-tier.active{color:var(--text)}
.set-tier.dim{opacity:.42}
</style>
</head>
<body>
<header>
<h1>⚔ War in the North · Legacy Edition — Build Builder</h1>
<div class="tabs" id="tabs">
<button data-t="skills" class="on">Навыки</button>
<button data-t="gear">Снаряжение</button>
<button data-t="squad">Отряд</button>
<button data-t="build">Билд</button>
</div>
<div class="lang-sw"><button data-l="en">EN</button><button data-l="ru" class="on">RU</button></div>
</header>
<main>
<section class="panel" id="content"></section>
<aside class="panel" id="side"></aside>
</main>
<div id="loader"><div class="ld-box"><div class="ld-title">Загрузка базы данных…</div><div class="ld-stage" id="ldStage">подключение…</div><div class="ld-bar"><div id="ldFill"></div></div></div></div>
<footer>Некоммерческий фанатский инструмент. Данные: <a href="https://witn.fandom.com">WitN Wiki</a> (CC BY-SA 3.0) · Код: MIT · Поддержка разработки: добровольные донаты (см. LICENSE)</footer>
<script>
/* ================= I18N ================= */
const I18N={
en:{skills:"Skills",gear:"Equipment",squad:"Squad",build:"Build",loading:"Loading database…",conn:"connecting…",done:"Done",loadError:"Load error",refresh:" — refresh the page",heroes:"Heroes",items:"Items",skillpts:"Skill points",attrpts:"Attribute points",attrs:"Attributes",level:"Level",hero:"Hero",search:"Search…",weapons:"Weapons",armor:"Armor",sets:"Sets",potions:"Potions",ingredients:"Ingredients",bossloot:"Boss loot",stones:"Elf stones",best:"Best gear",all:"All",anyq:"Any quality",head:"Head",shoulders:"Shoulders",body:"Body",gloves:"Gloves",legs:"Leggings",boots:"Boots",rings:"Rings",amulets:"Amulets",equip:"Equip",unequip:"Unequip",toSlot:"Equip to",slots:"Slots",hp:"Health",power:"Power",armorS:"Armor",melee:"Melee damage",ranged:"Ranged damage",arrows:"Arrows",elems:"Elements",lockedBy2H:"taken by two-handed weapon",tier1:"Tier 1 · opens the branch",tierOpen:"✓ open",tierNeed:"🔒 need",ptsIn:"pts in",active:"Active",passive:"Passive",upToRanks:"up to",ranks:"ranks",points:"pts",treePts:"pts",tiersOpened:"tiers",strength:"Strength",will:"Will",dexterity:"Dexterity",stamina:"Stamina",export:"Export build",imp:"Import",reset:"Reset",badJson:"Invalid JSON",resetQ:"Reset the build?",mainhand:"Main hand",offhand:"Off-hand / shield",rangedSlot:"Ranged",pickStone:"Choose an elf stone",stoneSlot:"Elf stones",grade:"Grade",set:"Set",source:"Source",loot:"Loot",req:"Requirements",bonusPerGrade:"values by grade",noData:"No data.",effects:"EFFECTS",durability:"Durability",value:"Value",lvreq:"Lv req",strreq:"STR req",dexreq:"DEX req",wilreq:"WIL req",stareq:"STA req",piecesShort:"pc",lootSrc:"Loot",groupAttrs:"Primary Character Attributes",groupStats:"Class Statistics",groupCombat:"Combat Effects",groupElem:"Elemental Effects",groupBane:"Creature Bane Effects",groupSec:"Secondary Statistics and Effects",useAll:"All",useMelee:"Melee",useWeapon:"Weapon",stoneInserted:"stones inserted",tiersOf:"tiers",rangedSlotMage:"Magic (staff)",andrielNoRanged:"Andriel has no ranged weapon: she shoots magic bolts spending Power",magicRanged:"magic bolt"},
ru:{skills:"Навыки",gear:"Снаряжение",squad:"Отряд",build:"Билд",loading:"Загрузка базы данных…",conn:"подключение…",done:"Готово",loadError:"Ошибка загрузки",refresh:" — обновите страницу",heroes:"Навыки героев",items:"Предметы",skillpts:"Очки навыков",attrpts:"Очки атрибутов",attrs:"Атрибуты",level:"Уровень",hero:"Герой",search:"Поиск…",weapons:"Оружие",armor:"Броня",sets:"Сеты",potions:"Зелья",ingredients:"Ингредиенты",bossloot:"Лут боссов",stones:"Камни",best:"Лучшее",all:"Все",anyq:"Любое кач.",head:"Голова",shoulders:"Плечи",body:"Тело",gloves:"Перчатки",legs:"Поножи",boots:"Сапоги",rings:"Кольца",amulets:"Амулеты",equip:"Надеть",unequip:"Снять",toSlot:"Надеть в",slots:"Слоты",hp:"Здоровье",power:"Мощь",armorS:"Броня",melee:"Урон ближний",ranged:"Урон дальний",arrows:"Стрелы",elems:"Стихии",lockedBy2H:"занято двуручным оружием",tier1:"Тир 1 · открывает ветку",tierOpen:"✓ открыт",tierNeed:"🔒 нужно",ptsIn:"очк. в",active:"Активный",passive:"Пассивный",upToRanks:"до",ranks:"ранг.",points:"очк.",treePts:"очк.",tiersOpened:"тиров",strength:"Strength",will:"Will",dexterity:"Dexterity",stamina:"Stamina",export:"Экспорт билда",imp:"Импорт",reset:"Сброс",badJson:"Неверный JSON",resetQ:"Сбросить билд?",mainhand:"Оружие (правая)",offhand:"Вторая рука / щит",rangedSlot:"Дальний бой",pickStone:"Выбор камня-эльфа",stoneSlot:"Камни-эльфы",grade:"Грейд",set:"Набор",source:"Источник",loot:"Лут",req:"Требования",bonusPerGrade:"значения по грейдам",noData:"Нет данных.",effects:"ЭФФЕКТЫ",durability:"Прочность",value:"Цена",lvreq:"Треб. ур.",strreq:"Треб. СИЛ",dexreq:"Треб. ЛОВ",wilreq:"Треб. ВОЛ",stareq:"Треб. ВЫН",piecesShort:"предм.",lootSrc:"Лут",groupAttrs:"Основные атрибуты",groupStats:"Классовые характеристики",groupCombat:"Боевые эффекты",groupElem:"Стихийные эффекты",groupBane:"Урон существам",groupSec:"Вторичные характеристики",useAll:"Все",useMelee:"Ближний бой",useWeapon:"Оружие",stoneInserted:"камней вставлено",tiersOf:"ярусов",rangedSlotMage:"Магия (посох)",andrielNoRanged:"У Андриэль нет оружия дальнего боя: она стреляет магическими сгустками, тратя Мощь",magicRanged:"магический сгусток"}
};
let LANG=localStorage.getItem("witn-lang")||"ru";
function t(k){return (I18N[LANG]&&I18N[LANG][k])||I18N.en[k]||k;}
function D(rec){ // описание с учётом языка
 if(!rec)return "";
 if(LANG==="ru"&&RU_DESC){const r=RU_DESC[rec.name||rec.set||""];if(r&&r.text)return r.text;}
 return rec.description||rec.effect||"";}

/* ================= МОДЕЛЬ ================= */
const DB={heroes:{},items:{sets:[],weapons:[],armor:[],potions:[],ingredients:[],boss_loot:[],elf_stones:[],best_gear:[]}};
RU_DESC={};
const build={hero:"Eradan",level:20,attrs:{str:0,wil:0,dex:0,sta:0},skills:{},gear:{slots:{mainhand:null,offhand:null,ranged:null,head:null,shoulders:null,body:null,gloves:null,legs:null,boots:null,amulet:null,ring1:null,ring2:null},stones:{}}};
const SLOTORDER=["mainhand","offhand","ranged","head","shoulders","body","gloves","legs","boots","amulet","ring1","ring2"];
const SLOTNAMES={mainhand:"mainhand",offhand:"offhand",ranged:"rangedSlot",head:"head",shoulders:"shoulders",body:"body",gloves:"gloves",legs:"legs",boots:"boots",amulet:"amulets",ring1:"rings",ring2:"rings"};
const SLOTI18N={mainhand:"mainhand",offhand:"offhand",ranged:"rangedSlot"};
function rangedSlotName(){return build.hero==="Andriel"?t("rangedSlotMage"):t("rangedSlot");}
const ARMORFILTERS=[["Все","all"],["Headpiece","head"],["Shoulders","shoulders"],["Body","body"],["Gloves","gloves"],["Leggings","legs"],["Boots","boots"],["Rings","rings"],["Amulets","amulets"]];
const ARMORSLOTMAP={headpiece:"head",shoulders:"shoulders",body:"body",gloves:"gloves",leggings:"legs",boots:"boots",amulets:"amulet",amulet:"amulet",rings:null,ring:null};
const COEF={hpBase:50,hpPerSta:5,powerPerWil:3,melPerStr:2,rngPerDex:3,baseArrows:40,arrowsPerQuiver:10};
const BASE_ATTRS={Eradan:{str:11,dex:12,sta:10,wil:9},Farin:{str:12,dex:9,sta:11,wil:10},Andriel:{str:10,dex:11,sta:9,wil:12}};
const POWER_BASE={Eradan:43,Farin:43,Andriel:89};
const ATTRS=["str","wil","dex","sta"];
const ATTRKEY={strength:"str",will:"wil",dexterity:"dex",stamina:"sta"};
const tab={cur:"skills",eqType:"weapons",q:"",qual:"Все",armorSlot:"Все",setFilter:""};

/* ================= ДАННЫЕ ================= */
function setStage(txt,pct){const s=document.getElementById("ldStage"),f=document.getElementById("ldFill");
 if(s)s.textContent=txt;if(f)f.style.width=pct+"%";}
async function load(){
 const steps=[["skills/eradan","hero"],["skills/andriel","hero"],["skills/farin","hero"],
  ["items/sets","items"],["items/weapons","items"],["items/armor","items"],["items/potions","items"],
  ["items/ingredients","items"],["items/boss_loot","items"],["items/elf_stones","items"],["items/best_gear","items"],
  ["i18n/ru_desc","i18n"]];
 try{
  for(let i=0;i<steps.length;i++){
   setStage((steps[i][1]==="hero"?t("heroes"):steps[i][1]==="i18n"?"i18n":t("items"))+": "+steps[i][0].split("/")[1]+"…",Math.round(i/steps.length*100));
   const url="data/raw/"+steps[i][0]+".json";
   try{
    const d=await(await(fetch(url))).json();
    if(steps[i][1]==="hero")DB.heroes[steps[i][0].split("/")[1][0].toUpperCase()+steps[i][0].split("/")[1].slice(1)]=d;
    else if(steps[i][1]==="i18n")RU_DESC=d;
    else DB.items[steps[i][0].split("/")[1]]=d;
   }catch(e){if(steps[i][1]==="items")DB.items[steps[i][0].split("/")[1]]=[];}
  }
  setStage(t("done"),100);
  render();
  setTimeout(()=>{const l=document.getElementById("loader");if(l)l.style.display="none";},300);
 }catch(e){setStage(t("loadError")+": "+e.message+t("refresh"),0);}
}
function save(){localStorage.setItem("witn-build",JSON.stringify(build))}
function restore(){try{const s=localStorage.getItem("witn-build");if(!s)return;const d=JSON.parse(s);
 if(d.gear&&d.gear.armor){
  d.gear.slots={mainhand:d.gear.weapon||null,offhand:null,ranged:d.gear.ranged||null,head:null,shoulders:d.gear.armor.shoulders||null,body:d.gear.armor.body||null,gloves:d.gear.armor.gloves||null,legs:d.gear.armor.leggings||null,boots:d.gear.armor.boots||null,amulet:null,ring1:d.gear.armor.ring1||null,ring2:d.gear.armor.ring2||null};
  delete d.gear.armor;delete d.gear.weapon;delete d.gear.ranged;}
 if(!d.gear.stones)d.gear.stones={};
 Object.assign(build,d);}catch(e){}}
function esc(s){return (s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const el=id=>document.getElementById(id);
function icon(rec,glyph){
 if(rec&&rec.local_image)return `<div class="item-icon"><img src="${esc(rec.local_image)}" alt="" onerror="this.parentNode.textContent='${glyph}'"></div>`;
 return `<div class="item-icon">${glyph}</div>`;}
function skillPoints(){return Object.values(build.skills).reduce((a,s)=>a+(s.rank||0),0)}

/* ================= RU-ЛОКАЛИЗАЦИЯ ИМЁН И ЭФФЕКТОВ ================= */

function trFx(s){
 if(LANG!=="ru"||!s)return s;
 let out=String(s);

 out=out.replace(/\bFire\b/g,"огонь").replace(/\bIce\b/g,"лёд").replace(/\bShock\b/g,"молния")

  .replace(/\bPhysical\b/g,"физ.").replace(/\bWhen\s+Struck\b/g,"при ударе").replace(/\bStun\b/g,"оглушение")
  .replace(/\bPouch\b/g,"кошель").replace(/\bPouches\b/g,"кошели");
 out=out.replace(/\bnormal\b/gi,"нормальный").replace(/\bglowing\b/gi,"сияющий").replace(/\bshining\b/gi,"лучезарный").replace(/\bradiant\b/gi,"сияние").replace(/\blegendary\b/gi,"легендарный");
 return out;}

function trType(s){

/* ================= ТИРЫ ================= */
function treePoints(t){return t.skills.reduce((a,x)=>a+((build.skills[x.name]||{}).rank||0),0);}
function tierPoints(t,n){return t.skills.reduce((a,x)=>a+(((x.tier||1)===n)?((build.skills[x.name]||{}).rank||0):0),0);}
function skillGate(sk,t){
 const k=sk.tier||1;
 if(k<=1)return{need:0,has:0,base:null};
 if(k===2)return{need:1,has:tierPoints(t,1),base:"t1"};
 let sum=0;for(let j=2;j<k;j++)sum+=tierPoints(t,j);
 return{need:3*(k-2),has:sum,base:"t2+"};}
function canInvest(sk,t){const g=skillGate(sk,t);return g.has>=g.need;}

function findItem(name){
 if(!name)return null;
 for(const f of["weapons","armor","best_gear","boss_loot"])
  {const r=(DB.items[f]||[]).find(x=>x.name===name);if(r)return r;}
 return null;}
function parseEffects(rec){
 const out={str:0,wil:0,dex:0,sta:0,melee:0,ranged:0,armor:0,power:0,arrows:0,hp:0,elem:{},other:[]};
 const texts=[];
 if(rec){if(rec.effect&&rec.effect!=="-")texts.push(String(rec.effect));
  if(rec.bonuses){if(Array.isArray(rec.bonuses))texts.push(...rec.bonuses.map(String));else texts.push(...Object.values(rec.bonuses).map(String));}}
 for(const t of texts){
  for(const m of t.matchAll(/\+(\d+)\s*(Strength|Willpower|Will|Dexterity|Stamina)/gi)){
   let key=ATTRKEY[m[2].toLowerCase().replace("power","")];if(key)out[key]+=+m[1];}
  for(const m of t.matchAll(/\+(\d+)\s*(Fire|Ice|Shock|Poison|Light|Shadow)?\s*Damage/gi)){
   if(m[2])out.elem[m[2].toLowerCase()]=(out.elem[m[2].toLowerCase()]||0)+ +m[1];
   else out.melee+=+m[1];}
  for(const m of t.matchAll(/\+(\d+)\s*Armor/gi))out.armor+=+m[1];
  for(const m of t.matchAll(/\+(\d+)\s*Power/gi))out.power+=+m[1];
  for(const m of t.matchAll(/\+(\d+)\s*(Health|HP)\b/gi))out.hp+=+m[1];
 }
 return out;}
function dmgRange(s){if(s==null)return null;const m=String(s).match(/(\d+)\s*-\s*(\d+)/);
 if(!m)return null;return[+m[1],+m[2]];}
function stoneStat(stone,grade){
 if(!stone||!stone.values)return null;
 const v=stone.values[grade]??stone.values.normal??Object.values(stone.values)[0];
 const eff=(stone.effect||stone.name||"").toLowerCase();
 let key=ATTRKEY[eff]||(eff==="power"?"wil":eff==="armor"?"armor":eff==="health"?"hp":eff==="willpower"?"wil":null);
 return{key,value:v,eff};}
function computeStats(){
 const g=build.gear.slots;
 const base=BASE_ATTRS[build.hero]||{str:10,dex:10,sta:10,wil:10};
 const eff={str:base.str+build.attrs.str,wil:base.wil+build.attrs.wil,dex:base.dex+build.attrs.dex,sta:base.sta+build.attrs.sta};
 const acc={melee:0,ranged:0,armor:0,power:0,arrows:0,hp:0,elem:{}};
 for(const k of SLOTORDER){const it=findItem(g[k]);if(!it)continue;
  const e=parseEffects(it);
  for(const a of["str","wil","dex","sta"])eff[a]+=e[a];
  acc.melee+=e.melee;acc.ranged+=e.ranged;acc.armor+=e.armor;acc.power+=e.power;acc.arrows+=e.arrows;acc.hp+=e.hp;
  for(const el in e.elem)acc.elem[el]=(acc.elem[el]||0)+e.elem[el];
  if(typeof it.armor==="number")acc.armor+=it.armor;
  // камни-эльфы
  for(const st of(build.gear.stones[k]||[])){
   const stone=(DB.items.elf_stones||[]).find(x=>x.name===st.name);if(!stone)continue;
   const ss=stoneStat(stone,st.grade||"normal");
   if(!ss)continue;
   if(ss.key==="armor")acc.armor+=+ss.value||0;
   else if(ss.key==="hp")acc.hp+=+ss.value||0;
   else if(ss.key&&eff[ss.key]!==undefined)eff[ss.key]+=+ss.value||0;
  }
 }
 // бонусы сетов (активные ярусы)
 const sc=setCounts();
 for(const sn in sc){
  const s=(DB.items.sets||[]).find(x=>x.set===sn);if(!s)continue;
  for(const [tier,bonus] of Object.entries(s.bonuses)){
   if(sc[sn]>=+tier){const e=parseEffects({effect:bonus});
    for(const a of["str","wil","dex","sta"])eff[a]+=e[a];
    acc.melee+=e.melee;acc.ranged+=e.ranged;acc.armor+=e.armor;acc.power+=e.power;acc.arrows+=e.arrows;acc.hp+=e.hp;
    for(const el in e.elem)acc.elem[el]=(acc.elem[el]||0)+e.elem[el];}
  }
 }
 const q=(build.skills["Broad Quiver"]||{}).rank||0;
 acc.arrows+=q*COEF.arrowsPerQuiver;
 const mw=findItem(g.mainhand),rw=findItem(g.ranged),ow=findItem(g.offhand);
 const md=mw?dmgRange(mw.damage):null,rd=rw?dmgRange(rw.damage):null;
 const od=(ow&&(ow.type||"").match(/1-handed/i))?dmgRange(ow.damage):null;
 const melBonus=eff.str*COEF.melPerStr+acc.melee;
 let melee=md?Math.round(md[0]+melBonus)+" – "+Math.round(md[1]+melBonus):"—";
 if(md&&od)melee+=" + "+Math.round(od[0]+melBonus)+" – "+Math.round(od[1]+melBonus);
 return{
  attrs:eff,
  hp:COEF.hpBase+eff.sta*COEF.hpPerSta+acc.hp,
  power:(POWER_BASE[build.hero]||43)+eff.wil*COEF.powerPerWil+acc.power,
  melee,
  ranged:(build.hero==="Andriel"&&!rd)
   ?`<span title="${esc(t("andrielNoRanged"))}">${t("magicRanged")}</span>`
   :(rd?Math.round(rd[0]+eff.dex*COEF.rngPerDex+acc.ranged)+" – "+Math.round(rd[1]+eff.dex*COEF.rngPerDex+acc.ranged):"—"),
  armor:acc.armor,
  arrows:COEF.baseArrows+acc.arrows,
  elem:acc.elem};
}
function reqsOk(rec){
 if(!rec)return{ok:true,msg:""};const st=computeStats();let ok=true,msg=[];
 if(rec.level_req&&build.level<+rec.level_req){ok=false;msg.push("Lv"+rec.level_req);}
 const R={str_req:"str",wil_req:"wil",dex_req:"dex",sta_req:"sta"};
 for(const k in R){if(rec[k]&&st.attrs[R[k]]<+rec[k]){ok=false;msg.push(R[k].toUpperCase()+" "+rec[k]);}}
 return{ok,msg:msg.join(" ")};}

function equipWeapon(rec){
 const nm=rec.name, ty=rec.type||"", g=build.gear.slots;
 if(ty.match(/bow|crossbow/i)){
  if(build.hero==="Andriel"){alert(t("andrielNoRanged"));return;}
  g.ranged=g.ranged===nm?null:nm;}
 else if(ty.match(/2-handed|staff/i)){
  if(g.mainhand===nm&&g.offhand==="2H"){g.mainhand=null;g.offhand=null;}
  else{g.mainhand=nm;g.offhand="2H";}
 }else if(ty.match(/shield/i)){
  const mh=findItem(g.mainhand);
  if(mh&&(mh.type||"").match(/2-handed|staff/i))g.mainhand=null;
  g.offhand=g.offhand===nm?null:nm;
 }else{
  const mh=findItem(g.mainhand);
  const dw=((build.skills["Dual Wield"]||{}).rank||0)>0;
  if(mh&&!(mh.type||"").match(/2-handed|staff/i)&&g.mainhand!==nm&&dw)g.offhand=g.offhand===nm?null:nm;
  else g.mainhand=g.mainhand===nm?null:nm;
 }
 save();render();
}

 let fx=[];
 if(r.effect&&r.effect!=="-")fx.push(String(r.effect));
 if(r.bonuses){if(Array.isArray(r.bonuses))fx.push(...r.bonuses.map(String));else fx.push(...Object.entries(r.bonuses).map(([n,b])=>n+" "+t("piecesShort")+": "+b));}
 const fxHtml=fx.length?`<div class="effects-box"><div class="fx-t">${t("effects")}</div>${fx.map(x=>`<div class="fx-line">${esc(trFx(x))}</div>`).join("")}</div>`:"";
 const src=r.source?`<div class="source-box">📦 ${t("source")}: ${esc(String(r.source).slice(0,80))}</div>`:"";
 const mySet=getSetOf(r);
 const setLine=mySet?setBonusesHTML(mySet,setCounts()):"";
 // камни
 const nslots=(r.slots&&String(r.slots).match(/^\d+$/))?+r.slots:0;
 const stones=(build.gear.stones[nm]||[]);
 let stoneHtml="";
 if(nslots>0){
  stoneHtml=`<div class="stone-row">${t("stoneSlot")}:
   ${Array.from({length:nslots},(_,i)=>{
    const st=stones[i];
    return st?`<span class="stone-cell full" data-stone-un="${nm}" data-idx="${i}" title="${esc(st.name)}${st.grade&&st.grade!=="normal"?" ("+st.grade+")":""} — click to remove">◆</span>`
             :`<span class="stone-cell" data-stone="${nm}" data-idx="${i}" title="${t("pickStone")}">+</span>`;}).join("")}
  </div>`;
 }
 let btn;
 if(tab.eqType==="weapons"||tab.eqType==="boss_loot"){
  const is2H=(r.type||"").match(/2-handed|staff/i);
  const target=is2H?t("mainhand"):(r.type||"").match(/bow|crossbow/i)?t("rangedSlot"):(r.type||"").match(/shield/i)?t("offhand"):t("mainhand");
  btn=`<button class="btn" data-eq-w="${esc(nm)}">${isSel?t("unequip"):t("toSlot")+" "+target}</button>`;
 }else if(tab.eqType==="armor"||tab.eqType==="best_gear"){
  const s=String(r.slot||"").toLowerCase();
  let slotKey=ARMORSLOTMAP[s];
  if(s==="rings"||s==="ring")slotKey="ring1";
  btn=slotKey?`<button class="btn" data-eq-a="${esc(nm)}" data-slot="${slotKey}">${isSel?t("unequip"):t("toSlot")+" "+t(SLOTI18N[slotKey]||slotKey)}</button>`:"";
 }
 return `<div class="item-card ${isSel?"selected":""}">
  <div class="item-head">${icon(r,"🛡")}
   <div class="item-title"><div class="item-name">${esc(LANG==="ru"?N(r):nm)}</div><div class="item-type">${LANG==="ru"?esc(trType(ty)):tyBadges}</div></div>
  </div>
  ${statsHtml}
  ${fxHtml}
  ${src}${setLine}
  ${stoneHtml}
  ${btn||""}
 </div>`;
}

function viewGear(){
 const types=[["weapons","weapons"],["armor","armor"],["sets","sets"],["potions","potions"],["ingredients","ingredients"],["boss_loot","bossloot"],["elf_stones","stones"],["best_gear","best"]];
 let h=`<h2>${t("gear")}</h2><div class="filters">`+
  types.map(([k,n])=>`<button class="chip ${tab.eqType===k?"on":""}" data-tp="${k}">${t(n)}</button>`).join("")+
  `<input type="text" id="search" placeholder="${t("search")}" value="${esc(tab.q)}"></div>`;
 if(tab.eqType==="armor"){
  h+=`<div class="filters">`+ARMORFILTERS.map(([k,n])=>`<button class="chip ${tab.armorSlot===k?"on":""}" data-as="${k}">${t(n)}</button>`).join("")+
   `<span style="width:8px"></span>`+["Все","Standard","High","Masterwork"].map(x=>`<button class="chip ${tab.qual===x?"on":""}" data-ql="${x}">${x==="Все"?t("anyq"):x}</button>`).join("")+`</div>`;
 }
 const q=tab.q.toLowerCase();
 let rows=DB.items[tab.eqType]||[];
 if(q)rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q));
 if(tab.eqType==="armor"&&tab.qual!=="Все")rows=rows.filter(r=>r.quality===tab.qual+" Quality"||r.quality===tab.qual);
 if(tab.eqType==="armor"&&tab.armorSlot!=="Все")rows=rows.filter(r=>r.slot===tab.armorSlot);
 if(!rows.length)return h+`<p style='color:var(--dim)'>${t("noData")}</p>`;
 if(tab.eqType==="sets"){
  const all=(DB.items.armor||[]).concat(DB.items.best_gear||[]).filter(r=>getSetOf(r));
  const names=[...new Set(all.map(r=>getSetOf(r)))].sort();
  h+=`<div class="filters"><select id="setFilter"><option value="">${t("all")} (${all.length})</option>`+
   names.map(n=>`<option ${tab.setFilter===n?"selected":""}>${esc(n)}</option>`).join("")+`</select></div>`;
  let rows2=all;
  if(tab.setFilter)rows2=all.filter(r=>getSetOf(r)===tab.setFilter);
  if(q)rows2=rows2.filter(r=>JSON.stringify(r).toLowerCase().includes(q));
  return h+`<div class="grid">`+rows2.map(itemCard).join("")+`</div>`;
 }
 if(tab.eqType==="elf_stones"){
  return h+`<div class="grid">`+rows.map(r=>`<div class="item-card">
   <div class="item-head">${icon(r,"◆")}
    <div class="item-title"><div class="item-name">${esc(LANG==="ru"?N(r):r.name)}</div><div class="item-type">${esc(trGroup(r.group))} · ${esc(trUse(r.usability))}</div></div></div>
   <div class="item-stats">${Object.entries(r.values).map(([g,v])=>`<div class="stat-line"><span class="stat-label">${esc(trFx(g))}</span><span class="stat-value">${esc(v)}</span></div>`).join("")}</div>
   ${r.effect&&r.effect!==r.name?`<div class="meta" style="color:var(--dim);font-size:11.5px">${esc(r.effect)}</div>`:""}
  </div>`).join("")+`</div>`;
 }
 if(tab.eqType==="potions"||tab.eqType==="ingredients"){
  return h+`<div class="grid">`+rows.map(r=>`<div class="item-card">
   <div class="item-head">${icon(r,"🧪")}
    <div class="item-title"><div class="item-name">${esc(r.name)}</div></div></div>
   ${r.value!==undefined&&r.value!==""?`<div class="item-stats"><div class="stat-line"><span class="stat-label">Value</span><span class="stat-value">${esc(r.value)}</span></div></div>`:""}
   ${r.description&&r.description!=="-"?`<div class="ds" style="color:var(--dim);font-size:12px">${esc(D(r)||r.description)}</div>`:""}
  </div>`).join("")+`</div>`;
 }
 return h+`<div class="grid">`+rows.map(itemCard).join("")+`</div>`;
}
function viewSquad(){
 return `<h2>${t("squad")}</h2>
 <div class="row"><label>${t("hero")}</label><select id="heroSel">${Object.keys(DB.heroes).map(h2=>`<option ${h2===build.hero?"selected":""}>${h2}</option>`).join("")}</select></div>
 <div class="row"><label>${t("level")}</label><input type="number" id="lvl" min="1" max="40" value="${build.level}"></div>
 <div class="row"><label>${t("skillpts")}: <b class="${skillPoints()>build.level?"warn":"ok"}">${skillPoints()} / ${build.level}</b></label></div>
 <h2>${t("attrs")}</h2>
 ${ATTRS.map(k=>`<div class="attr"><label>${t({str:"strength",wil:"will",dex:"dexterity",sta:"stamina"}[k])}</label><button class="btn sm" data-at="${k}" data-d="-1">−</button><b>${build.attrs[k]}</b><button class="btn sm" data-at="${k}" data-d="1">+</button></div>`).join("")}
 <div class="row"><label>${t("attrpts")}: <b class="${attrPoints()>build.level*3?"warn":"ok"}">${attrPoints()} / ${build.level*3}</b></label></div>
 <hr style="border-color:var(--brown)">
 <button class="btn sm" id="expBtn2">${t("export")}</button>
 <button class="btn sm" id="impBtn2">${t("imp")}</button>
 <button class="btn sm" id="rstBtn2">${t("reset")}</button>
 <textarea id="ioBox2" placeholder="JSON…"></textarea>`;
}
function viewBuild(){
 const hero=DB.heroes[build.hero];const chosen=[];
 hero.trees.forEach(tr=>tr.skills.forEach(s=>{const r=(build.skills[s.name]||{}).rank||0;if(r)chosen.push({t:t.name,...s,rank:r})}));
 const st=computeStats();
 const gear=SLOTORDER.map(k=>build.gear.slots[k]&&`<span class="badge b">${t(SLOTI18N[k]||k)}: ${esc(LANG==="ru"?(N(findItem(build.gear.slots[k]))||build.gear.slots[k]):build.gear.slots[k])}${(build.gear.stones[k]||[]).length?" ◆"+(build.gear.stones[k]||[]).length:""}</span>`).filter(Boolean).join(" ");
 return `<h2>${t("build")}: ${build.hero}, ${t("level").toLowerCase()} ${build.level}</h2>
 <p style="color:var(--dim)">${t("skillpts")}: ${skillPoints()}/${build.level} · ${t("attrpts")}: ${attrPoints()}/${build.level*3}</p>
 ${statBlock(st)}
 <h2>${t("skills")} (${chosen.length})</h2>
 ${chosen.map(c=>`<div class="skill">${icon(c,c.type==="active"?"⚡":"◈")}
  <div style="flex:1"><div class="nm">${esc(c.name)} <span class="badge">${esc(c.t)}</span>
  ${c.max_rank?`<span class="badge s">${c.rank}/${c.max_rank}</span>`:""}</div>
  <div class="ds">${esc(D(c)||c.description)}</div></div></div>`).join("")||"<p style='color:var(--dim)'>—</p>"}
 <h2>${t("gear")}</h2>${gear||"<span style='color:var(--dim)'>—</span>"}`;
}

/* ================= МОДАЛКА КАМНЕЙ ================= */
function openStonePicker(itemName,idx){
 const stones=DB.items.elf_stones||[];
 const m=document.createElement("div");m.className="modal";
 m.innerHTML=`<div class="modal-box"><h3>${t("pickStone")} — ${esc(itemName)} [${idx+1}]</h3>`+
  stones.map(s=>`<div class="stone-pick" data-pick="${esc(s.name)}">
   <div><b>${esc(s.name)}</b> <span class="gr">${esc(s.group)} · ${esc(s.usability)}</span><br>
   <span class="gr">${Object.entries(s.values).map(([g,v])=>g+": "+v).join(" · ")}</span></div>
  </div>`).join("")+
  `<button class="btn sm" data-close="1" style="margin-top:8px">✕</button></div>`;
 document.body.appendChild(m);
 m.querySelectorAll("[data-pick]").forEach(x=>x.onclick=()=>{
  const name=x.dataset.pick;
  if(!build.gear.stones[itemName])build.gear.stones[itemName]=[];
  build.gear.stones[itemName][idx]={name,grade:"normal"};
  document.body.removeChild(m);save();render();});
 m.querySelector("[data-close]").onclick=()=>document.body.removeChild(m);
}

/* ================= СОБЫТИЯ ================= */
function bind(){
 document.querySelectorAll("#tabs button").forEach(x=>x.onclick=()=>{tab.cur=x.dataset.t;
  document.querySelectorAll("#tabs button").forEach(y=>y.classList.toggle("on",y===x));render()});
 document.querySelectorAll(".lang-sw button").forEach(x=>x.onclick=()=>{LANG=x.dataset.l;
  localStorage.setItem("witn-lang",LANG);document.querySelectorAll(".lang-sw button").forEach(y=>y.classList.toggle("on",y===x));render()});
 document.querySelectorAll(".skill[data-sk]").forEach(card=>{
  card.onclick=()=>{const name=card.dataset.sk,max=+card.dataset.max;
   const cur=(build.skills[name]||{}).rank||0;
   if(cur<max){
    const hero=DB.heroes[build.hero];
    for(const t2 of hero.trees){const sk=t2.skills.find(x=>x.name===name);
     if(sk){if(!canInvest(sk,t2)){card.style.borderLeft="3px solid var(--red)";
      setTimeout(()=>card.style.borderLeft="",400);return;}break;}}
   }
   build.skills[name]={rank:cur>=max?0:cur+1};save();render();};
  card.oncontextmenu=e=>{e.preventDefault();const name=card.dataset.sk;
   const cur=(build.skills[name]||{}).rank||0;
   build.skills[name]={rank:Math.max(0,cur-1)};save();render();};});
 document.querySelectorAll("[data-tp]").forEach(x=>x.onclick=()=>{tab.eqType=x.dataset.tp;tab.armorSlot="Все";render()});
 document.querySelectorAll("[data-ql]").forEach(x=>x.onclick=()=>{tab.qual=x.dataset.ql==="Все"?"Все":x.dataset.ql;render()});
 document.querySelectorAll("[data-as]").forEach(x=>x.onclick=()=>{tab.armorSlot=x.dataset.as;render()});
 const sf=el("setFilter");if(sf)sf.onchange=()=>{tab.setFilter=sf.value;render()};
 const sq=el("search");if(sq){sq.oninput=()=>{tab.q=sq.value;render();const s2=el("search");
  s2.focus();s2.setSelectionRange(s2.value.length,s2.value.length)}}
 // экипировка
 document.querySelectorAll("[data-eq-w]").forEach(b=>b.onclick=e=>{
  const nm=b.dataset.eqW;const rec=findItem(nm);if(rec)equipWeapon(rec);});
 document.querySelectorAll("[data-eq-a]").forEach(b=>b.onclick=()=>{
  const nm=b.dataset.eqA,slot=b.dataset.slot;
  const s=String(findItem(nm)?.slot||"").toLowerCase();
  let target=slot;
  if(s==="rings"||s==="ring")target=build.gear.slots.ring1?(build.gear.slots.ring1===nm?"ring1":"ring2"):"ring1";
  build.gear.slots[target]=build.gear.slots[target]===nm?null:nm;
  if(build.gear.slots[target]!==nm)delete build.gear.stones[nm];
  save();render();});
 // камни
 document.querySelectorAll("[data-stone]").forEach(x=>x.onclick=()=>openStonePicker(x.dataset.stone,+x.dataset.idx));
 document.querySelectorAll("[data-stone-un]").forEach(x=>x.onclick=()=>{
  const arr=build.gear.stones[x.dataset.stoneUn];if(arr)arr.splice(+x.dataset.idx,1);
  save();render();});
 // отряд
 const hs=el("heroSel");if(hs)hs.onchange=()=>{build.hero=hs.value;save();render()};
 const lv=el("lvl");if(lv)lv.onchange=()=>{build.level=Math.max(1,Math.min(40,+lv.value||1));save();render()};
 document.querySelectorAll("[data-at]").forEach(x=>x.onclick=()=>{const k=x.dataset.at,d=+x.dataset.d;
  build.attrs[k]=Math.max(0,build.attrs[k]+d);save();render()});
 const e2=el("expBtn2");if(e2)e2.onclick=()=>{el("ioBox2").value=JSON.stringify(build);el("ioBox2").select();document.execCommand("copy")};
 const i2=el("impBtn2");if(i2)i2.onclick=()=>{try{Object.assign(build,JSON.parse(el("ioBox2").value));save();render()}catch(x){alert(t("badJson"))}};
 const rst2=el("rstBtn2");if(rst2)rst2.onclick=()=>{if(confirm(t("resetQ"))){localStorage.removeItem("witn-build");location.reload()}};
}
restore();load();
</script>
